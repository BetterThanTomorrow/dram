<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>acme frontend</title>
    <link rel="stylesheet" href="main.css">
  </head>
  <body>
    <div id="root">
      <p>Waiting 10s for the app to compile and load...</p>
      <p>(Edit index.html to change this behavior)</p>
    </div>
    <script>
      setTimeout(function() {
        var s = document.createElement("script");
        s.src = "js/compiled/main.js";
        document.body.appendChild(s);
      }, 10000);
    </script>
  </body>
</html>
